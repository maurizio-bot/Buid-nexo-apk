name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-yo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ultra-yo.apk
          gh release create "v0.2.${{ github.run_number }}" ultra-yo.apk \
            --target "${{ github.sha }}" \
            --title "Ultra Yo 0.2.${{ github.run_number }}" \
            --notes "Descarga ultra-yo.apk en el teléfono e instálalo." \
            $([ "${{ github.ref_name }}" = "main" ] || echo --prerelease)
